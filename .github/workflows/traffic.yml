name: Traffic

on:
    # Each run starts the next one, as GitHub drops most scheduled runs. The schedule only restarts the chain after a
    # failed run. Minute 7 avoids the rush of the jobs scheduled on the hour.
    schedule:
        - cron: '7 * * * *'
    workflow_dispatch:

permissions:
    # Starts the next run.
    actions: write
    # Pushes the traffic-state branch.
    contents: write

# Runs one at a time: the next run waits for the current one. GitHub keeps a single waiting run, so it cancels a
# scheduled run that was waiting too.
concurrency:
    group: ${{ github.workflow }}

jobs:
    simulate:
        runs-on: ubuntu-latest
        timeout-minutes: 70
        env:
            GIT_AUTHOR_NAME: github-actions[bot]
            GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            GIT_COMMITTER_NAME: github-actions[bot]
            GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: castor
            - run: castor traffic:memorize
            - run: castor traffic:simulate --duration=55
            # Skipped after a failure, so that a broken run does not start again and again.
            - run: gh workflow run traffic.yml
              env:
                  GH_TOKEN: ${{ github.token }}
