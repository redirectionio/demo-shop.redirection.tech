name: Traffic

on:
    schedule:
        # Each run simulates 55 minutes of traffic. Minute 7 avoids the rush of the jobs scheduled on the hour, which
        # GitHub delays.
        - cron: '7 * * * *'
    workflow_dispatch:

permissions:
    # Pushes the traffic-state branch.
    contents: write

# Runs one at a time: a late run waits for the previous one.
concurrency:
    group: ${{ github.workflow }}

jobs:
    simulate:
        runs-on: ubuntu-latest
        timeout-minutes: 70
        env:
            GIT_AUTHOR_NAME: github-actions[bot]
            GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
            GIT_COMMITTER_NAME: github-actions[bot]
            GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: castor
            - run: castor traffic:memorize
            - run: castor traffic:simulate --duration=55
